name: Sanitizers

on:
  workflow_dispatch:

jobs:
  core-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: tsan
            name: ThreadSanitizer + UBSan
            cxx_flags: -fsanitize=thread,undefined -fno-omit-frame-pointer
            link_flags: -fsanitize=thread,undefined
          - sanitizer: asan
            name: AddressSanitizer + LeakSanitizer + UBSan
            cxx_flags: -fsanitize=address,undefined -fsanitize-recover=address -fno-omit-frame-pointer
            link_flags: -fsanitize=address,undefined
          # No sanitizer: the timer hand-off race (W) needs glibc's immediate reuse of freed memory,
          # which every sanitizer allocator delays, so only this build can see it.
          - sanitizer: plain
            name: Plain build
            cxx_flags: ""
            link_flags: ""
    # ROS Jazzy comes preinstalled in the container. ros-tooling/setup-ros was
    # pulling ros-jazzy-desktop and its toolchain (965 packages, 591 MB) through
    # the runner's Ubuntu mirror, which took hours on a slow mirror. The same
    # container pattern is used by jazzy-binary-build.yml.
    # seccomp=unconfined lets the TSan run disable ASLR with setarch -R, which
    # needs personality(); the default Docker profile refuses that call.
    container:
      image: ros:jazzy-ros-base
      options: --security-opt seccomp=unconfined
    # A container job runs its steps with sh unless told otherwise; the steps source setup.bash.
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        # Only the packages the build step selects. A whole-tree rosdep would
        # pull nav2, MoveIt and Gazebo, which this job does not build.
        run: |
          apt-get update
          rosdep update
          rosdep install --ignore-src -r -y --from-paths \
            smacc2 \
            smacc2_msgs \
            smacc2_client_library/cl_ros2_timer \
            smacc2_state_reactor_library/sr_all_events_go \
            smacc2_state_reactor_library/sr_event_countdown \
            smacc2_state_reactor_library/sr_conditional \
            smacc2_event_generator_library/eg_conditional_generator \
            smacc2_event_generator_library/eg_random_generator \
            smacc2_sm_reference_library/sm_atomic \
            smacc2_sm_reference_library/sm_cl_ros2_timer_unit_test_1 \
            smacc2_performance_tools/performance_tests/sm_coretest_forced_finish_1 \
            smacc2_performance_tools/performance_tests/sm_coretest_signal_key_1 \
            smacc2_performance_tools/performance_tests/sm_coretest_poll_shutdown_1 \
            smacc2_performance_tools/performance_tests/sm_coretest_transition_speed_1 \
            smacc2_performance_tools/performance_tests/sm_coretest_reactor_order_1 \
            smacc2_performance_tools/performance_tests/sm_coretest_post_during_exit_1 \
            smacc2_performance_tools/performance_tests/sm_coretest_timer_handoff_1 \
            smacc2_performance_tools/performance_tests/sm_coretest_exceptions_1 \
            smacc2_performance_tools/performance_tests/sm_coretest_action_client_1

      - name: Build the message package without sanitizer flags
        # The gate calls the transition history service through the ros2 CLI, which imports the
        # message package's Python typesupport; a sanitized build of that extension cannot be
        # loaded into the plain Python interpreter.
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select smacc2_msgs --cmake-args -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=OFF

      - name: Build with ${{ matrix.name }}
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build \
            --packages-select \
              smacc2 \
              cl_ros2_timer \
              sr_all_events_go \
              sr_event_countdown \
              sr_conditional \
              eg_conditional_generator \
              eg_random_generator \
              sm_atomic \
              sm_cl_ros2_timer_unit_test_1 \
              sm_coretest_forced_finish_1 \
              sm_coretest_signal_key_1 \
              sm_coretest_poll_shutdown_1 \
              sm_coretest_transition_speed_1 \
              sm_coretest_reactor_order_1 \
              sm_coretest_post_during_exit_1 \
              sm_coretest_timer_handoff_1 \
              sm_coretest_exceptions_1 \
              sm_coretest_action_client_1 \
            --cmake-args \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}" \
              -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.link_flags }}" \
              -DBUILD_TESTING=OFF

      - name: Run the core tests under ${{ matrix.name }}
        # Forced finish (20 cycles and 10 random interrupts), signal key, reactor order,
        # timer hand-off, post during exit, poll shutdown (10 interrupts in the 75 % window),
        # transition speed, the fourteen exception sites and the five action goal outcomes. Fails on any sanitizer report with a SMACC2 frame, a crash, a hang or a
        # broken test invariant.
        run: |
          source /opt/ros/jazzy/setup.bash
          mkdir -p sanitizer_out
          .github/scripts/sanitizer_core_tests.sh ${{ matrix.sanitizer }} install sanitizer_out 2>&1 | tee sanitizer_out/console.log

      - name: Summarize on the run page
        if: always()
        run: python3 .github/scripts/gate_summary.py sanitizers "${{ matrix.name }}" sanitizer_out/console.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-${{ matrix.sanitizer }}-logs
          path: sanitizer_out/
          if-no-files-found: ignore
