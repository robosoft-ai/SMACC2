name: CodeQL

on:
  workflow_dispatch:

jobs:
  analyze:
    name: CodeQL Analysis (C++)
    runs-on: ubuntu-24.04
    # ROS Jazzy comes preinstalled in the container, as in ci-sanitizers.yml and
    # jazzy-binary-build.yml. ros-tooling/setup-ros fetched its apt source from a
    # GitHub release through an unauthenticated API lookup, which failed on a
    # GitHub 504 on 2026-11-08 and is exposed to the anonymous API rate limit.
    container:
      image: ros:jazzy-ros-base
    # A container job runs its steps with sh unless told otherwise; the steps source setup.bash.
    defaults:
      run:
        shell: bash
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        # The rosdeps of the packages the build step selects: the core, every client library the
        # clang-tidy gate reads, and nine machines. px4_msgs, which cl_px4_mr needs, has no binary package and comes
        # from the repos file.
        run: |
          apt-get update
          vcs import < .github/SMACC2.jazzy.repos
          rosdep update
          rosdep install --ignore-src -r -y --from-paths \
            smacc2 \
            smacc2_msgs \
            smacc2_client_library/cl_keyboard \
            smacc2_client_library/cl_ros2_timer \
            smacc2_client_library/cl_generic_sensor \
            smacc2_client_library/cl_lifecycle_node \
            smacc2_client_library/cl_px4_mr \
            smacc2_client_library/cl_moveit2z \
            smacc2_client_library/cl_http \
            smacc2_client_library/cl_gcalcli \
            smacc2_client_library/cl_modbus_tcp_relay \
            smacc2_client_library/cl_foundation_pose \
            smacc2_client_library/cl_mission_tracker \
            px4_msgs \
            smacc2_client_library/cl_nav2z/cl_nav2z \
            smacc2_client_library/cl_nav2z/custom_planners/backward_global_planner \
            smacc2_client_library/cl_nav2z/custom_planners/backward_local_planner \
            smacc2_client_library/cl_nav2z/custom_planners/forward_global_planner \
            smacc2_client_library/cl_nav2z/custom_planners/forward_local_planner \
            smacc2_client_library/cl_nav2z/custom_planners/nav2z_planners_common \
            smacc2_client_library/cl_nav2z/custom_planners/pure_spinning_local_planner \
            smacc2_client_library/cl_nav2z/custom_planners/undo_path_global_planner \
            smacc2_state_reactor_library/sr_all_events_go \
            smacc2_sm_reference_library/sm_atomic \
            smacc2_sm_reference_library/sm_atomic_http \
            smacc2_sm_reference_library/sm_atomic_lifecycle \
            smacc2_sm_reference_library/sm_cl_gcalcli_test_1 \
            smacc2_sm_reference_library/sm_cl_px4_mr_test_1 \
            smacc2_sm_reference_library/sm_modbus_tcp_relay_test_1 \
            smacc2_sm_reference_library/sm_nav2_gazebo_test_1 \
            smacc2_sm_reference_library/sm_panda_cl_moveit2z_cb_inventory \
            smacc2_sm_reference_library/sm_three_some

      - name: Build the message packages
        # Before CodeQL starts watching the compiler: their code is generated and is not analyzed.
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select smacc2_msgs px4_msgs --cmake-args -DBUILD_TESTING=OFF

      - name: Initialize CodeQL
        # security-and-quality, plus the MISRA C++:2023 queries for the dynamic memory rules 21.6.2 to
        # 21.6.5 from GitHub's coding standards pack. Rule 21.6.1 is left out: SMACC2 allocates by design.
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          queries: security-and-quality
          packs: codeql/misra-cpp-coding-standards:rules/RULE-21-6-2,codeql/misra-cpp-coding-standards:rules/RULE-21-6-3,codeql/misra-cpp-coding-standards:rules/RULE-21-6-4,codeql/misra-cpp-coding-standards:rules/RULE-21-6-5

      - name: Build
        # The nine machines are here to instantiate the templates of the core and the client libraries:
        # CodeQL reports nothing in a template that no built package uses. With --symlink-install a
        # header a machine includes is its source file, not a copy under install/ that the filter drops.
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install \
            --packages-select \
              smacc2 \
              cl_keyboard \
              cl_ros2_timer \
              cl_generic_sensor \
              cl_lifecycle_node \
              cl_px4_mr \
              cl_moveit2z \
              cl_http \
              cl_gcalcli \
              cl_modbus_tcp_relay \
              cl_foundation_pose \
              cl_mission_tracker \
              cl_nav2z \
              backward_global_planner \
              backward_local_planner \
              forward_global_planner \
              forward_local_planner \
              nav2z_planners_common \
              pure_spinning_local_planner \
              undo_path_global_planner \
              sr_all_events_go \
              sm_atomic \
              sm_atomic_http \
              sm_atomic_lifecycle \
              sm_cl_gcalcli_test_1 \
              sm_cl_px4_mr_test_1 \
              sm_modbus_tcp_relay_test_1 \
              sm_nav2_gazebo_test_1 \
              sm_panda_cl_moveit2z_cb_inventory \
              sm_three_some \
            --cmake-args -DBUILD_TESTING=OFF

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:c-cpp
          output: sarif-results
          upload: false

      - name: Filter generated paths from SARIF
        run: |
          python3 - <<'EOF'
          import json, glob, re
          SUPPRESSED_RULES = {
              'cpp/empty-block',
              'cpp/sizeof-side-effect',
          }
          def is_rclcpp_comment(result):
              """Return True if every flagged location is a commented-out RCLCPP_ call.
              Falls back to reading the source file when SARIF snippet.text is absent."""
              locs = result.get('locations', [])
              if not locs:
                  return False
              for loc in locs:
                  phys = loc.get('physicalLocation', {})
                  region = phys.get('region', {})
                  snippet = region.get('snippet', {}).get('text', '')
                  if not snippet:
                      uri = phys.get('artifactLocation', {}).get('uri', '')
                      start_line = region.get('startLine', 0)
                      if uri and start_line:
                          try:
                              with open(uri) as src:
                                  lines = src.readlines()
                              snippet = lines[start_line - 1] if start_line <= len(lines) else ''
                          except (IOError, OSError):
                              return False
                  if not re.search(r'//\s*RCLCPP_', snippet):
                      return False
              return True
          def is_smacc_tracing_header_guard(result):
              """Suppress header-guard warnings for smacc_tracing files.
              trace_provider.hpp uses the lttng multi-include pattern which
              is intentionally incompatible with #pragma once."""
              if 'header' not in result.get('ruleId', '').lower():
                  return False
              return any(
                  'smacc_tracing' in loc.get('physicalLocation', {})
                                        .get('artifactLocation', {})
                                        .get('uri', '')
                  for loc in result.get('locations', [])
              )
          for path in glob.glob('sarif-results/*.sarif'):
              with open(path) as f:
                  sarif = json.load(f)
              for run in sarif.get('runs', []):
                  results = run.get('results', [])
                  dropped = sum(
                      1 for r in results
                      if any(loc.get('physicalLocation', {}).get('artifactLocation', {})
                                .get('uri', '').startswith(('build/', 'install/'))
                             for loc in r.get('locations', []))
                  )
                  print(f'{path}: {len(results)} results, {dropped} under build/ or install/')
                  run['results'] = [
                      r for r in results
                      if r.get('ruleId', '') not in SUPPRESSED_RULES
                      and not is_rclcpp_comment(r)
                      and not is_smacc_tracing_header_guard(r)
                      and not any(
                          loc.get('physicalLocation', {})
                             .get('artifactLocation', {})
                             .get('uri', '')
                             .startswith(('build/', 'install/'))
                          for loc in r.get('locations', [])
                      )
                  ]
              with open(path, 'w') as f:
                  json.dump(sarif, f)
          EOF

      - name: Summarize the MISRA results on the run page
        # One table of the dynamic memory rules with their result counts, then the results one per line.
        if: always()
        run: |
          python3 .github/scripts/codeql_misra_summary.py sarif-results >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the filtered results as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: sarif-results
          if-no-files-found: ignore

      - name: Upload filtered results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results
          category: /language:c-cpp
